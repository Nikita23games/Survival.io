<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выживание в лесу - UI Update</title>
    <style>
        :root {
            --bg-color: #1a2e1a;
            --panel-bg: rgba(20, 20, 20, 0.95);
            --accent: #f59e0b;
            --slot-bg: #1f2937;
            --slot-border: #374151;
            --slot-selected: #3b82f6;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas { display: block; }

        /* Панель ресурсов */
        .stats-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .stat-item {
            background: var(--panel-bg);
            padding: 10px 18px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Хотбар - ПОДНЯТ ВЫШЕ */
        #hotbar-container {
            position: absolute;
            bottom: 40px; /* Было 25px */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 10px;
            z-index: 40;
        }

        #hotbar {
            display: flex;
            gap: 6px;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .slot {
            width: 52px;
            height: 52px;
            background: var(--slot-bg);
            border: 2px solid var(--slot-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slot.selected {
            border-color: var(--slot-selected);
            background: rgba(59, 130, 246, 0.3);
            transform: scale(1.1) translateY(-8px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        /* Кнопка Рюкзака */
        #btn-backpack {
            background: var(--accent);
            border: none;
            width: 58px;
            height: 58px;
            border-radius: 16px;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b45309;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        #btn-backpack:active { transform: translateY(4px); box-shadow: 0 2px 0 #b45309; }

        /* Окно Инвентаря */
        #inventory-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(10px);
        }

        .inv-window {
            background: #111;
            border: 3px solid #78350f;
            border-radius: 32px;
            padding: 24px;
            width: 95%;
            max-width: 480px;
        }

        .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
        }

        #close-inv {
            background: #ef4444;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
        }

        .craft-section {
            display: grid;
            grid-template-columns: auto auto auto;
            align-items: center;
            gap: 20px;
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 24px;
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .result-slot {
            width: 80px;
            height: 80px;
            background: #000;
            border: 3px dashed #444;
            border-radius: 20px;
            font-size: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .result-slot.available {
            border: 3px solid #10b981;
            background: rgba(16, 185, 129, 0.1);
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        /* Управление */
        #joystick-zone {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 140px;
            height: 140px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
            z-index: 60;
        }

        #joystick-stick {
            position: absolute;
            top: 50%; left: 50%;
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #btn-punch {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 110px;
            height: 110px;
            background: #ef4444;
            border: none;
            border-bottom: 8px solid #991b1b;
            border-radius: 50%;
            color: white;
            font-weight: 900;
            font-size: 20px;
            z-index: 60;
            cursor: pointer;
        }
        #btn-punch:active { transform: translateY(4px); border-bottom-width: 2px; }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="stats-panel">
        <div class="stat-item">🪵 <span id="log-count">0</span></div>
        <div class="stat-item">🪨 <span id="stone-count">0</span></div>
    </div>

    <!-- Обновленный контейнер Хотбара -->
    <div id="hotbar-container">
        <div id="hotbar">
            <div class="slot hb-slot" data-idx="0"></div>
            <div class="slot hb-slot" data-idx="1"></div>
            <div class="slot hb-slot" data-idx="2"></div>
            <div class="slot hb-slot" data-idx="3"></div>
            <div class="slot hb-slot" data-idx="4"></div>
            <div class="slot hb-slot" data-idx="5"></div>
        </div>
        <button id="btn-backpack">🎒</button>
    </div>

    <div id="inventory-overlay">
        <div class="inv-window">
            <div class="inv-header">
                <span>Крафт и Снаряжение</span>
                <button id="close-inv">✕</button>
            </div>

            <div class="craft-section">
                <div class="grid-3x3" id="craft-grid-el">
                    <div class="slot craft-slot" data-cidx="0"></div>
                    <div class="slot craft-slot" data-cidx="1"></div>
                    <div class="slot craft-slot" data-cidx="2"></div>
                    <div class="slot craft-slot" data-cidx="3"></div>
                    <div class="slot craft-slot" data-cidx="4"></div>
                    <div class="slot craft-slot" data-cidx="5"></div>
                    <div class="slot craft-slot" data-cidx="6"></div>
                    <div class="slot craft-slot" data-cidx="7"></div>
                    <div class="slot craft-slot" data-cidx="8"></div>
                </div>
                <div style="color: #f59e0b; font-size: 32px;">➔</div>
                <div class="result-slot-container">
                    <div id="craft-result" class="result-slot"></div>
                </div>
            </div>

            <div class="inventory-grid" id="main-inventory"></div>
        </div>
    </div>

    <div id="joystick-zone">
        <div id="joystick-stick"></div>
    </div>
    <button id="btn-punch">УДАР</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Состояние игры
    const WORLD_SIZE = 2500;
    let logs = parseInt(localStorage.getItem('surv_logs')) || 0;
    let stone = parseInt(localStorage.getItem('surv_stone')) || 0;
    let inventory = JSON.parse(localStorage.getItem('surv_inv')) || new Array(18).fill(null);
    let craftGrid = new Array(9).fill(null);
    let craftResultItem = null;
    let selectedSlot = null; 

    const player = {
        x: WORLD_SIZE / 2, y: WORLD_SIZE / 2,
        radius: 20, angle: 0, speed: 5.5,
        isPunching: false, punchFrame: 0
    };

    const camera = { x: 0, y: 0 };
    let shake = 0;
    const worldObjects = [];
    const joystick = { active: false, x: 0, y: 0, dx: 0, dy: 0 };

    // Инициализация
    function init() {
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 90; i++) {
            const type = Math.random() > 0.45 ? 'tree' : 'stone';
            worldObjects.push({
                x: Math.random() * (WORLD_SIZE - 200) + 100,
                y: Math.random() * (WORLD_SIZE - 200) + 100,
                type: type,
                radius: type === 'tree' ? 24 : 20
            });
        }

        updateUI();
        requestAnimationFrame(gameLoop);
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    // Сохранение
    function save() {
        localStorage.setItem('surv_logs', logs);
        localStorage.setItem('surv_stone', stone);
        localStorage.setItem('surv_inv', JSON.stringify(inventory));
    }

    // Интерфейс
    function updateUI() {
        document.getElementById('log-count').innerText = logs;
        document.getElementById('stone-count').innerText = stone;

        const invEl = document.getElementById('main-inventory');
        invEl.innerHTML = '';
        inventory.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = `slot ${selectedSlot?.type === 'inv' && selectedSlot.index === i ? 'selected' : ''}`;
            div.innerHTML = item ? item.icon : '';
            div.onclick = () => handleSlotClick('inv', i);
            invEl.appendChild(div);
        });

        const hbSlots = document.querySelectorAll('.hb-slot');
        hbSlots.forEach((slot, i) => {
            slot.innerHTML = inventory[i] ? inventory[i].icon : '';
            slot.onclick = () => handleSlotClick('inv', i); // Добавляем клик в хотбаре
        });

        const cSlots = document.querySelectorAll('.craft-slot');
        cSlots.forEach((slot, i) => {
            slot.innerHTML = craftGrid[i] ? craftGrid[i].icon : '';
            slot.className = `slot craft-slot ${selectedSlot?.type === 'craft' && selectedSlot.index === i ? 'selected' : ''}`;
            slot.onclick = () => handleSlotClick('craft', i);
        });

        checkCrafting();
    }

    function handleSlotClick(type, index) {
        if (document.getElementById('inventory-overlay').style.display !== 'flex') return;

        const currentList = (type === 'inv') ? inventory : craftGrid;
        
        if (!selectedSlot) {
            if (currentList[index]) {
                selectedSlot = { type, index };
            }
        } else {
            const sourceList = (selectedSlot.type === 'inv') ? inventory : craftGrid;
            const temp = currentList[index];
            currentList[index] = sourceList[selectedSlot.index];
            sourceList[selectedSlot.index] = temp;
            selectedSlot = null;
            save();
        }
        updateUI();
    }

    function checkCrafting() {
        const logCount = craftGrid.filter(i => i?.type === 'log').length;
        const resEl = document.getElementById('craft-result');
        
        craftResultItem = null;
        resEl.innerHTML = '';
        resEl.classList.remove('available');

        if (logCount === 1 && craftGrid.filter(i => i).length === 1) {
            craftResultItem = { type: 'planks', icon: '📦' };
        } else if (logCount >= 4) {
            craftResultItem = { type: 'bench', icon: '🛠️' };
        }

        if (craftResultItem) {
            resEl.innerHTML = craftResultItem.icon;
            resEl.classList.add('available');
            resEl.onclick = () => {
                const emptyIdx = inventory.findIndex(s => s === null);
                if (emptyIdx !== -1) {
                    inventory[emptyIdx] = craftResultItem;
                    craftGrid.fill(null);
                    save();
                    updateUI();
                }
            };
        }
    }

    function gameLoop() {
        if (document.getElementById('inventory-overlay').style.display !== 'flex') {
            updatePlayer();
        }
        draw();
        requestAnimationFrame(gameLoop);
    }

    function updatePlayer() {
        if (joystick.active) {
            player.angle = Math.atan2(joystick.dy, joystick.dx);
            const dist = Math.min(Math.hypot(joystick.dx, joystick.dy) / 50, 1);
            
            const nx = player.x + Math.cos(player.angle) * player.speed * dist;
            const ny = player.y + Math.sin(player.angle) * player.speed * dist;

            let canMoveX = nx > 0 && nx < WORLD_SIZE;
            let canMoveY = ny > 0 && ny < WORLD_SIZE;

            worldObjects.forEach(obj => {
                if (Math.hypot(nx - obj.x, player.y - obj.y) < player.radius + obj.radius) canMoveX = false;
                if (Math.hypot(player.x - obj.x, ny - obj.y) < player.radius + obj.radius) canMoveY = false;
            });

            if (canMoveX) player.x = nx;
            if (canMoveY) player.y = ny;
        }

        if (player.isPunching) {
            player.punchFrame += 0.25;
            if (player.punchFrame >= Math.PI) {
                player.isPunching = false;
                player.punchFrame = 0;
            }
        }

        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
        shake *= 0.9;
    }

    function draw() {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-camera.x + (Math.random()-0.5)*shake, -camera.y + (Math.random()-0.5)*shake);

        ctx.fillStyle = '#2d4c2d';
        ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

        const renderList = [...worldObjects, { ...player, isPlayer: true }].sort((a,b) => a.y - b.y);

        renderList.forEach(obj => {
            if (obj.isPlayer) {
                ctx.save();
                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.angle);
                ctx.fillStyle = '#ffdbac';
                const p = obj.isPunching ? Math.sin(obj.punchFrame) * 22 : 0;
                ctx.beginPath(); ctx.arc(18+p, -16, 9, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(18+p, 16, 9, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, obj.radius, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
                ctx.restore();
            } else {
                if (obj.type === 'tree') {
                    ctx.fillStyle = '#3e2723'; ctx.fillRect(obj.x-12, obj.y-5, 24, 35);
                    const dist = Math.hypot(player.x - obj.x, player.y - (obj.y - 50));
                    ctx.globalAlpha = dist < 90 ? 0.35 : 1;
                    ctx.fillStyle = '#1b5e20'; ctx.beginPath(); ctx.arc(obj.x, obj.y-50, 75, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = '#616161'; ctx.beginPath(); 
                    ctx.moveTo(obj.x-20, obj.y+15); ctx.lineTo(obj.x, obj.y-20); ctx.lineTo(obj.x+20, obj.y+15); ctx.fill();
                }
            }
        });
        ctx.restore();
    }

    document.getElementById('btn-punch').addEventListener('pointerdown', () => {
        if (player.isPunching) return;
        player.isPunching = true;
        
        worldObjects.forEach(obj => {
            if (Math.hypot(player.x - obj.x, player.y - obj.y) < player.radius + obj.radius + 40) {
                shake = 18; 
                const item = obj.type === 'tree' ? {type:'log', icon:'🪵'} : {type:'stone', icon:'🪨'};
                if (obj.type === 'tree') logs++; else stone++;
                
                const emptyIdx = inventory.findIndex(s => s === null);
                if (emptyIdx !== -1) inventory[emptyIdx] = item;
                
                updateUI();
                save();
            }
        });
    });

    const jZone = document.getElementById('joystick-zone');
    const jStick = document.getElementById('joystick-stick');
    jZone.addEventListener('pointerdown', e => {
        joystick.active = true;
        const r = jZone.getBoundingClientRect();
        joystick.x = r.left + r.width/2;
        joystick.y = r.top + r.height/2;
    });

    window.addEventListener('pointermove', e => {
        if (!joystick.active) return;
        joystick.dx = e.clientX - joystick.x;
        joystick.dy = e.clientY - joystick.y;
        const dist = Math.min(Math.hypot(joystick.dx, joystick.dy), 50);
        const ang = Math.atan2(joystick.dy, joystick.dx);
        jStick.style.transform = `translate(calc(-50% + ${Math.cos(ang)*dist}px), calc(-50% + ${Math.sin(ang)*dist}px))`;
    });

    window.addEventListener('pointerup', () => {
        joystick.active = false;
        joystick.dx = 0; joystick.dy = 0;
        jStick.style.transform = `translate(-50%, -50%)`;
    });

    document.getElementById('btn-backpack').onclick = () => document.getElementById('inventory-overlay').style.display = 'flex';
    document.getElementById('close-inv').onclick = () => {
        document.getElementById('inventory-overlay').style.display = 'none';
        selectedSlot = null;
        updateUI();
    };

    init();
</script>
</body>
</html>
