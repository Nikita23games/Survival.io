<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выживание в лесу - WASD & Mouse</title>
    <style>
        :root {
            --bg-color: #1a2e1a;
            --panel-bg: rgba(20, 20, 20, 0.95);
            --accent: #f59e0b;
            --slot-bg: #1f2937;
            --slot-border: #374151;
            --slot-selected: #3b82f6;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: crosshair;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas { display: block; }

        /* Ресурсы */
        .stats-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
            pointer-events: none;
        }

        .stat-item {
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Инвентарь и Хотбар */
        #ui-bottom {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 15px;
            z-index: 100;
        }

        #hotbar {
            display: flex;
            gap: 8px;
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .slot {
            width: 60px;
            height: 60px;
            background: var(--slot-bg);
            border: 2px solid var(--slot-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .slot.selected {
            border-color: var(--slot-selected);
            background: rgba(59, 130, 246, 0.2);
            transform: scale(1.1) translateY(-10px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }

        #btn-inv-toggle {
            background: var(--accent);
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 18px;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b45309;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #btn-inv-toggle:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b45309;
        }

        /* Оверлей Инвентаря */
        #inventory-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(10px);
        }

        .inv-window {
            background: #18181b;
            border: 3px solid #78350f;
            border-radius: 32px;
            padding: 30px;
            width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: var(--accent);
            font-weight: 800;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #close-inv {
            background: #ef4444;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .craft-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .res-slot {
            width: 85px;
            height: 85px;
            background: #09090b;
            border: 3px dashed #3f3f46;
            border-radius: 20px;
            font-size: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .res-slot.active {
            border: 3px solid #10b981;
            background: rgba(16, 185, 129, 0.1);
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
        }

        /* Подсказки */
        .controls-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.4);
            color: #ccc;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            pointer-events: none;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="stats-panel">
        <div class="stat-item">🪵 <span id="log-count">0</span></div>
        <div class="stat-item">🪨 <span id="stone-count">0</span></div>
    </div>

    <div class="controls-hint">
        <b>Управление:</b><br>
        Перемещение: <b>WASD</b><br>
        Удар/Добыча: <b>Левая кнопка мыши</b><br>
        Инвентарь: <b>E</b> или <b>кнопка 🎒</b>
    </div>

    <div id="ui-bottom">
        <div id="hotbar">
            <div class="slot hb-slot" data-idx="0"></div>
            <div class="slot hb-slot" data-idx="1"></div>
            <div class="slot hb-slot" data-idx="2"></div>
            <div class="slot hb-slot" data-idx="3"></div>
            <div class="slot hb-slot" data-idx="4"></div>
            <div class="slot hb-slot" data-idx="5"></div>
        </div>
        <button id="btn-inv-toggle">🎒</button>
    </div>

    <div id="inventory-overlay">
        <div class="inv-window">
            <div class="inv-header">
                <span>Мастерская выживания</span>
                <button id="close-inv">✕</button>
            </div>

            <div class="craft-area">
                <div class="grid-3x3" id="craft-grid-ui">
                    <div class="slot craft-slot" data-cidx="0"></div>
                    <div class="slot craft-slot" data-cidx="1"></div>
                    <div class="slot craft-slot" data-cidx="2"></div>
                    <div class="slot craft-slot" data-cidx="3"></div>
                    <div class="slot craft-slot" data-cidx="4"></div>
                    <div class="slot craft-slot" data-cidx="5"></div>
                    <div class="slot craft-slot" data-cidx="6"></div>
                    <div class="slot craft-slot" data-cidx="7"></div>
                    <div class="slot craft-slot" data-cidx="8"></div>
                </div>
                <div style="color: var(--accent); font-size: 40px;">➔</div>
                <div id="craft-result" class="res-slot"></div>
            </div>

            <div class="main-grid" id="inv-grid-ui"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Настройки мира
    const WORLD_SIZE = 3000;
    let logs = parseInt(localStorage.getItem('survival_logs')) || 0;
    let stone = parseInt(localStorage.getItem('survival_stone')) || 0;
    let inventory = JSON.parse(localStorage.getItem('survival_inv')) || new Array(18).fill(null);
    let craftGrid = new Array(9).fill(null);
    let craftResult = null;
    let selectedSlot = null; // {type: 'inv'|'craft', index: number}

    const player = {
        x: WORLD_SIZE / 2,
        y: WORLD_SIZE / 2,
        radius: 22,
        angle: 0,
        speed: 6,
        isPunching: false,
        punchFrame: 0
    };

    const keys = { w: false, a: false, s: false, d: false };
    const mouse = { x: 0, y: 0 };
    const camera = { x: 0, y: 0 };
    let shakeAmount = 0;
    const worldObjects = [];

    function init() {
        // Генерация ресурсов
        for (let i = 0; i < 120; i++) {
            const type = Math.random() > 0.4 ? 'tree' : 'rock';
            worldObjects.push({
                x: Math.random() * (WORLD_SIZE - 200) + 100,
                y: Math.random() * (WORLD_SIZE - 200) + 100,
                type: type,
                radius: type === 'tree' ? 26 : 22
            });
        }
        
        resize();
        updateUI();
        requestAnimationFrame(gameLoop);
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function save() {
        localStorage.setItem('survival_logs', logs);
        localStorage.setItem('survival_stone', stone);
        localStorage.setItem('survival_inv', JSON.stringify(inventory));
    }

    // Обработка ввода
    window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) keys[k] = true;
        if (k === 'e') toggleInventory();
    });

    window.addEventListener('keyup', e => {
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) keys[k] = false;
    });

    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    window.addEventListener('mousedown', e => {
        if (e.button === 0 && !player.isPunching && document.getElementById('inventory-overlay').style.display !== 'flex') {
            performPunch();
        }
    });

    function performPunch() {
        player.isPunching = true;
        player.punchFrame = 0;

        worldObjects.forEach(obj => {
            const dist = Math.hypot(player.x - obj.x, player.y - obj.y);
            if (dist < player.radius + obj.radius + 45) {
                // Эффект тряски (shake)
                shakeAmount = 20; 
                
                const item = obj.type === 'tree' ? {type:'log', icon:'🪵'} : {type:'stone', icon:'🪨'};
                if (obj.type === 'tree') logs++; else stone++;
                
                // Добавляем в инвентарь если есть место
                const freeIdx = inventory.findIndex(s => s === null);
                if (freeIdx !== -1) inventory[freeIdx] = item;
                
                updateUI();
                save();
            }
        });
    }

    // Интерфейс
    function updateUI() {
        document.getElementById('log-count').innerText = logs;
        document.getElementById('stone-count').innerText = stone;

        const invGrid = document.getElementById('inv-grid-ui');
        invGrid.innerHTML = '';
        inventory.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = `slot ${selectedSlot?.type === 'inv' && selectedSlot.index === i ? 'selected' : ''}`;
            div.innerHTML = item ? item.icon : '';
            div.onclick = () => onSlotClick('inv', i);
            invGrid.appendChild(div);
        });

        const hotbarSlots = document.querySelectorAll('.hb-slot');
        hotbarSlots.forEach((slot, i) => {
            slot.innerHTML = inventory[i] ? inventory[i].icon : '';
        });

        const craftSlots = document.querySelectorAll('.craft-slot');
        craftSlots.forEach((slot, i) => {
            slot.innerHTML = craftGrid[i] ? craftGrid[i].icon : '';
            slot.className = `slot craft-slot ${selectedSlot?.type === 'craft' && selectedSlot.index === i ? 'selected' : ''}`;
            slot.onclick = () => onSlotClick('craft', i);
        });

        checkCraft();
    }

    function onSlotClick(type, index) {
        if (!selectedSlot) {
            const list = type === 'inv' ? inventory : craftGrid;
            if (list[index]) selectedSlot = { type, index };
        } else {
            const source = selectedSlot.type === 'inv' ? inventory : craftGrid;
            const target = type === 'inv' ? inventory : craftGrid;
            
            const temp = target[index];
            target[index] = source[selectedSlot.index];
            source[selectedSlot.index] = temp;
            
            selectedSlot = null;
            save();
        }
        updateUI();
    }

    function checkCraft() {
        const logsCount = craftGrid.filter(i => i?.type === 'log').length;
        const resBox = document.getElementById('craft-result');
        craftResult = null;
        resBox.innerHTML = '';
        resBox.classList.remove('active');

        if (logsCount === 1 && craftGrid.filter(i => i).length === 1) {
            craftResult = { type: 'plank', icon: '📦' };
        } else if (logsCount >= 4) {
            craftResult = { type: 'workbench', icon: '🛠️' };
        }

        if (craftResult) {
            resBox.innerHTML = craftResult.icon;
            resBox.classList.add('active');
            resBox.onclick = () => {
                const freeIdx = inventory.findIndex(s => s === null);
                if (freeIdx !== -1) {
                    inventory[freeIdx] = craftResult;
                    craftGrid.fill(null);
                    save();
                    updateUI();
                }
            };
        }
    }

    function toggleInventory() {
        const overlay = document.getElementById('inventory-overlay');
        const isOpen = overlay.style.display === 'flex';
        overlay.style.display = isOpen ? 'none' : 'flex';
        selectedSlot = null;
        updateUI();
    }

    document.getElementById('btn-inv-toggle').onclick = toggleInventory;
    document.getElementById('close-inv').onclick = toggleInventory;

    // Главный цикл
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        if (document.getElementById('inventory-overlay').style.display === 'flex') return;

        // Движение WASD
        let moveX = 0;
        let moveY = 0;
        if (keys.w) moveY -= 1;
        if (keys.s) moveY += 1;
        if (keys.a) moveX -= 1;
        if (keys.d) moveX += 1;

        if (moveX !== 0 || moveY !== 0) {
            const mag = Math.hypot(moveX, moveY);
            const nx = player.x + (moveX / mag) * player.speed;
            const ny = player.y + (moveY / mag) * player.speed;

            let canMoveX = nx > 0 && nx < WORLD_SIZE;
            let canMoveY = ny > 0 && ny < WORLD_SIZE;

            worldObjects.forEach(obj => {
                if (Math.hypot(nx - obj.x, player.y - obj.y) < player.radius + obj.radius) canMoveX = false;
                if (Math.hypot(player.x - obj.x, ny - obj.y) < player.radius + obj.radius) canMoveY = false;
            });

            if (canMoveX) player.x = nx;
            if (canMoveY) player.y = ny;
        }

        // Поворот за мышью
        const screenCenterX = canvas.width / 2;
        const screenCenterY = canvas.height / 2;
        player.angle = Math.atan2(mouse.y - screenCenterY, mouse.x - screenCenterX);

        // Анимация удара
        if (player.isPunching) {
            player.punchFrame += 0.25;
            if (player.punchFrame >= Math.PI) {
                player.isPunching = false;
                player.punchFrame = 0;
            }
        }

        camera.x = player.x - canvas.width / 2;
        camera.y = player.y - canvas.height / 2;
        shakeAmount *= 0.9;
    }

    function draw() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        // Применяем тряску к камере
        const sx = (Math.random() - 0.5) * shakeAmount;
        const sy = (Math.random() - 0.5) * shakeAmount;
        ctx.translate(-camera.x + sx, -camera.y + sy);

        // Земля
        ctx.fillStyle = '#2d4c2d';
        ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

        // Сетка для ориентира
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 2;
        for(let i=0; i<WORLD_SIZE; i+=200) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i); ctx.stroke();
        }

        // Рендер объектов
        const drawList = [...worldObjects, { ...player, isPlayer: true }].sort((a,b) => a.y - b.y);

        drawList.forEach(obj => {
            if (obj.isPlayer) {
                ctx.save();
                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.angle);
                ctx.fillStyle = '#ffdbac';
                const p = obj.isPunching ? Math.sin(obj.punchFrame) * 25 : 0;
                ctx.beginPath(); ctx.arc(20+p, -18, 10, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(20+p, 18, 10, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, obj.radius, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
                ctx.restore();
            } else {
                if (obj.type === 'tree') {
                    ctx.fillStyle = '#3e2723'; ctx.fillRect(obj.x-14, obj.y-5, 28, 40);
                    const d = Math.hypot(player.x - obj.x, player.y - (obj.y - 50));
                    ctx.globalAlpha = d < 100 ? 0.3 : 1;
                    ctx.fillStyle = '#1b5e20'; ctx.beginPath(); ctx.arc(obj.x, obj.y-50, 80, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1;
                } else {
                    ctx.fillStyle = '#616161'; ctx.beginPath();
                    ctx.moveTo(obj.x-25, obj.y+15); ctx.lineTo(obj.x, obj.y-25); ctx.lineTo(obj.x+25, obj.y+15); ctx.fill();
                }
            }
        });
        ctx.restore();
    }

    window.addEventListener('resize', resize);
    init();
</script>
</body>
</html>
